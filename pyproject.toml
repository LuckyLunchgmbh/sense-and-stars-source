[project]
name = "sense-and-stars"
version = "1.3.1"
requires-python = ">=3.12,<3.13"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["backend/requirements.runtime.lock"]}

[tool.setuptools.packages.find]
include = ["backend.app*"]

[tool.setuptools.package-data]
"backend.app" = ["academy_content/*.json"]
