name: SoulFlow prüfen
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic_ci_only
          POSTGRES_DB: soulflow_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SOULFLOW_TEST_POSTGRES_URL: postgresql://postgres:synthetic_ci_only@127.0.0.1:5432/soulflow_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements.lock
      - run: python -m pytest -c backend/pytest.ini backend/tests -q
      - run: npm ci --prefix frontend
      - run: npm test --prefix frontend
      - run: npm run build --prefix frontend
      - run: node --check frontend/public/sw.js
      - run: git diff --check
